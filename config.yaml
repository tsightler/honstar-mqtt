name: Honstar MQTT
version: "1.2.6"
slug: honstar-mqtt
description: >-
  Bridges Honda/Acura EV connected vehicle data to MQTT.
  Polls vehicle status (battery, range, tires, charging, odometer)
  and publishes to MQTT topics.
url: https://github.com/tsightler/honstar-mqtt
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
startup: application
boot: auto
services:
  - mqtt:need
options:
  email: ""
  password: ""
  pin: ""
  vin: ""
  mqtt_url: "mqtt://auto_username:auto_password@auto_hostname"
  poll_interval: 900
  debug: false
schema:
  email: email
  password: password
  pin: str?
  vin: str?
  mqtt_url: str?
  poll_interval: int?
  debug: bool?
image: ghcr.io/tsightler/honstar-mqtt-{arch}
init: false
